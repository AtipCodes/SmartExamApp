<div><b>{{ q.prompt }}</b></div>

{% if q.image %}
  <img src="{{ url_for('static', filename='uploads/' ~ q.image) }}" style="max-width:100%; border:1px solid #ccc;">
{% endif %}

<div style="margin-top:10px">
  {% set choices_list = choices or [] %}
  {% if choices_list|length > 0 %}
    {# MCQ #}
    {% for c in choices_list %}
      <label>
        <input type="radio" name="choice" value="{{ c }}" {% if saved_answer==c %}checked{% endif %}>
        {{ c }}
      </label><br>
    {% endfor %}
  {% else %}
    {# Open-ended #}
    <textarea name="choice" style="width:100%" rows="6">{{ saved_answer }}</textarea>
  {% endif %}
</div>
