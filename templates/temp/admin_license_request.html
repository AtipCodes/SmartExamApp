{% extends 'base.html' %}
{% block title %} Chat View {% endblock %}
{% block content %}

        <h2>Admin License Request</h2>
        <form method="post">
            <label>Number of Licenses:</label>
            <input type="number" name="num" min="1" required><br><br>
            <label>Duration (days):</label>
            <input type="number" name="duration" value="365" required><br><br>
            <label>Email Address:</label>
            <input type="email" name="email" value="@abc.com" required><br><br>
            <label>Phone Number:</label>
            <input type="tel" name="phone" value="+1" required><br><br>

            <button type="submit">Submit Request</button>
        </form>
        <a href="{{ url_for('dashboard') }}">Cancel</a>

{% endblock %}
