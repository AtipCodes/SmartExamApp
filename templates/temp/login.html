{% extends 'base.html' %}
{% block title %} Login / Register {% endblock %}
{% block content %}

<div class="login-wrapper">
  <div class="login-card">
    <h2>Login</h2>
    <form method="post" class="login-form">
      <input type="hidden" name="action" value="login">
      <div><label>Username <input name="username" required></label></div>
      <div><label>Password <input name="password" type="password" required></label></div>
      <button class="btn">Login</button>
    </form>

    <p>
      <a href="{{ url_for('reset_password_request') }}" class="forgot-link">
        🔑 Forgot Password? (Admin/Licensing only)
      </a>
    </p>

    <hr>

    <h2>Student Registration</h2>
    <form method="post" class="login-form">
      <input type="hidden" name="action" value="register">
      <div><label>First Name <input name="first_name" required></label></div>
      <div><label>Surname <input name="last_name" required></label></div>
      <div><label>Email (optional) <input name="email" type="email"></label></div>
      <div><label>Username <input name="username" required></label></div>
      <div><label>Password <input name="password" type="password" required></label></div>
      <button class="btn">Register</button>
    </form>
  </div>
</div>

<style>
  .login-wrapper {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    height: 100vh;
    padding-right: 5%;
    background: #f7f9fc;
  }
  .login-card {
    background: #fff;
    padding: 2em;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    width: 33%;
    max-width: 400px;
    min-width: 280px;
    text-align: right;
  }
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 0.8em;
  }
  .login-form input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-top: 3px;
  }
  .btn {
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
    font-weight: bold;
  }
  .btn:hover {
    background: #0056b3;
  }
  .forgot-link {
    color: #888;
    text-decoration: none;
    font-size: 0.9em;
  }
  .forgot-link:hover {
    color: #007bff;
    text-decoration: underline;
  }
</style>

{% endblock %}
